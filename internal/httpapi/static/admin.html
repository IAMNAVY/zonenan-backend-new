<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZoneNaN 管理后台</title>
<style>
:root{
  --bg:#0f1117; --surface:#181b24; --surface2:#1f2330; --border:#2a2f3d;
  --text:#e6e8ee; --text2:#9aa0ae; --primary:#5b8cff; --primary-d:#4a76e0;
  --danger:#ff5b6a; --ok:#3ecf8e; --warn:#ffb454; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--primary)}
/* 登录 */
#loginBox{max-width:360px;margin:12vh auto;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
#loginBox h1{font-size:22px;margin-bottom:6px}
#loginBox p{color:var(--text2);margin-bottom:20px;font-size:13px}
/* 布局 */
#app{display:none;min-height:100vh;grid-template-columns:220px minmax(0,1fr)}
#app.on{display:grid}
aside{background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .brand{font-size:18px;font-weight:700;padding:0 12px 20px;letter-spacing:.5px}
aside nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--text2);text-decoration:none;cursor:pointer;margin-bottom:2px;transition:.15s}
aside nav a:hover{background:var(--surface2);color:var(--text)}
aside nav a.active{background:var(--primary);color:#fff}
aside .logout{margin-top:20px}
main{padding:28px 32px;min-width:0;overflow-x:hidden}
.users-scroll{max-width:100%;overflow-x:auto}
.users-table{min-width:1100px}
.users-table td:last-child{min-width:260px}
.users-search{margin-bottom:14px}
.users-search input{flex:1 1 220px;min-width:0;width:auto}
.users-pagination{margin-top:16px}
.users-pagination .muted{flex:1 1 200px}
.users-jump input{width:80px;min-width:0}
.crash-scroll{max-width:100%;overflow-x:auto}
.crash-table{min-width:1050px}
.crash-message{max-width:420px;white-space:pre-wrap;overflow-wrap:anywhere}
.crash-stack{max-width:760px;max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
button:disabled{opacity:.45;cursor:not-allowed}
.page{display:none}.page.on{display:block}
h2.title{font-size:20px;margin-bottom:20px}
/* 组件 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:14px;color:var(--text)}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.stat{background:var(--surface2);border-radius:10px;padding:16px}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--text2);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:var(--surface2)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%;color:var(--text);font-size:13px;margin:5px 0;font-family:inherit}
textarea{min-height:90px;resize:vertical}
label{font-size:12px;color:var(--text2);display:block;margin-top:8px}
button{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
button:hover{background:var(--primary-d)}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
button.ghost:hover{color:var(--text);border-color:var(--text2)}
button.danger{background:var(--danger)}
button.sm{padding:5px 10px;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge.ok{background:rgba(62,207,142,.15);color:var(--ok)}
.badge.danger{background:rgba(255,91,106,.15);color:var(--danger)}
.badge.warn{background:rgba(255,180,84,.15);color:var(--warn)}
.badge.info{background:rgba(91,140,255,.15);color:var(--primary)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{margin:0}
.col{flex:1;min-width:140px}
.muted{color:var(--text2);font-size:12px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--primary);padding:12px 18px;border-radius:8px;opacity:0;transform:translateY(10px);transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translateY(0)}
.toast.err{border-left-color:var(--danger)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.analytics-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.analytics-head select{width:auto;min-width:130px}
.chart-wrap{position:relative;overflow-x:auto}
.chart{display:block;width:100%;min-width:620px;height:270px}
.chart .grid{stroke:var(--border);stroke-width:1}.chart .axis-label{fill:var(--text2);font-size:11px}
.chart .series-pau{fill:none;stroke:#3987e5;stroke-width:2}.chart .series-app{fill:none;stroke:#8f6be8;stroke-width:2}.chart .series-widget{fill:none;stroke:#3ecf8e;stroke-width:2}.chart .series-sessions{fill:none;stroke:#d95926;stroke-width:2}
.chart .hit{fill:transparent;cursor:crosshair}.chart .dot{stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:18px;color:var(--text2);font-size:12px;margin-bottom:8px}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart-tip{position:absolute;pointer-events:none;background:var(--surface2);border:1px solid var(--border);padding:8px 10px;border-radius:7px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:110px 1fr 72px;gap:10px;align-items:center}.bar-track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}.bar-fill{height:100%;background:#3987e5;border-radius:5px;min-width:2px}
details{margin-top:14px}summary{cursor:pointer;color:var(--text2);font-size:12px}.analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.map-picker{height:480px;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:10px;background:#dfe8dc;cursor:crosshair;touch-action:none;user-select:none}
.map-picker.dragging{cursor:grabbing}.map-picker img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.map-picker-marker{position:absolute;width:24px;height:24px;margin:-22px 0 0 -12px;border-radius:50% 50% 50% 0;background:#e94747;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.45);transform:rotate(-45deg);pointer-events:none;z-index:4}
.map-picker-marker::after{content:'';position:absolute;width:6px;height:6px;left:6px;top:6px;border-radius:50%;background:#fff}
.map-picker-note{position:absolute;left:10px;top:10px;z-index:5;background:rgba(15,17,23,.86);color:#fff;padding:6px 9px;border-radius:7px;font-size:12px;pointer-events:none}
.map-picker-credit{position:absolute;right:5px;bottom:4px;z-index:5;background:rgba(255,255,255,.78);color:#333;padding:1px 5px;font-size:10px;pointer-events:none}
.map-picker-zoom{position:absolute;right:10px;top:10px;z-index:6;display:grid;gap:5px}.map-picker-zoom button{width:36px;height:36px;padding:0;font-size:20px}
@media(max-width:900px){.analytics-grid{grid-template-columns:1fr}}
@media(max-width:600px){#app.on{grid-template-columns:minmax(0,1fr)}aside{position:static;height:auto}main{padding:20px 12px}#p-users .card{padding:14px}.formgrid{grid-template-columns:1fr}.map-picker{height:380px}}
</style>
</head>
<body>

<div id="loginBox">
  <h1>ZoneNaN 管理后台</h1>
  <p>输入管理密钥登录。建议在 Cloudflare Access 后再开放公网。</p>
  <input id="secret" type="password" placeholder="ADMIN_SECRET" onkeydown="if(event.key==='Enter')login()">
  <button style="width:100%;margin-top:10px" onclick="login()">登录</button>
</div>

<div id="app">
  <aside>
    <div class="brand">⬡ ZoneNaN</div>
    <nav id="nav"></nav>
    <div class="logout"><button class="ghost" style="width:100%" onclick="logout()">退出登录</button></div>
  </aside>
  <main>
    <div class="page" id="p-dashboard"></div>
    <div class="page" id="p-analytics"></div>
    <div class="page" id="p-crashes"></div>
    <div class="page" id="p-premium"></div>
    <div class="page" id="p-users"></div>
    <div class="page" id="p-announce"></div>
    <div class="page" id="p-ads"></div>
    <div class="page" id="p-evals"></div>
    <div class="page" id="p-risk"></div>
    <div class="page" id="p-settings"></div>
    <div class="page" id="p-releases"></div>
    <div class="page" id="p-classroom"></div>
    <div class="page" id="p-campus-map"></div>
    <div class="page" id="p-legal"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const PAGES=[
  ['dashboard','仪表盘'],['analytics','使用分析'],['crashes','崩溃上报'],['premium','Premium 会员'],['users','用户'],['announce','公告'],['ads','广告位'],
  ['evals','评教审核'],['risk','风控'],['settings','应用配置'],['releases','发布记录'],['classroom','空教数据'],['campus-map','校园地图'],['legal','协议文档']
];
let SECRET=sessionStorage.getItem('zn_admin_secret')||'';

// --- API ---
async function api(method,path,body){
  const opt={method,headers:{'Authorization':'Bearer '+SECRET}};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
  const res=await fetch(path,opt);
  const j=await res.json().catch(()=>({ok:false,message:'响应异常'}));
  if(!res.ok||j.ok===false)throw new Error(j.message||('HTTP '+res.status));
  return j.data;
}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast on'+(err?' err':'');setTimeout(()=>t.className='toast',2600)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTime(t){if(!t)return'-';return String(t).replace('T',' ').slice(0,16)}

// --- auth ---
async function login(){
  SECRET=document.getElementById('secret').value.trim();
  if(!SECRET)return toast('请输入密钥',1);
  try{await api('GET','/admin/grade/stats');sessionStorage.setItem('zn_admin_secret',SECRET);enter()}
  catch(e){toast('登录失败: '+e.message,1)}
}
function logout(){sessionStorage.removeItem('zn_admin_secret');location.reload()}
function enter(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('app').classList.add('on');
  const nav=document.getElementById('nav');
  nav.innerHTML=PAGES.map(([id,name])=>`<a data-p="${id}" onclick="go('${id}')">${name}</a>`).join('');
  go('dashboard');
}
function go(id){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.p===id));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  RENDER[id]();
}

// --- 各页渲染 ---
const RENDER={};

RENDER.dashboard=async()=>{
  const el=document.getElementById('p-dashboard');
  el.innerHTML='<h2 class="title">仪表盘</h2><div class="card"><div class="grid-stats" id="ds">加载中…</div></div>';
  try{
    const s=await api('GET','/admin/grade/stats');
    document.getElementById('ds').innerHTML=[
      ['课程档案',s.profiles],['成绩记录',s.scores],['关联数',s.links]
    ].map(([l,n])=>`<div class="stat"><div class="n">${n??0}</div><div class="l">${l}</div></div>`).join('');
  }catch(e){document.getElementById('ds').innerHTML='<span class="muted">'+esc(e.message)+'</span>'}
};

RENDER.analytics=async()=>{
  const el=document.getElementById('p-analytics');
  const days=+(document.getElementById('analyticsDays')?.value||30);
  el.innerHTML=`<div class="analytics-head"><h2 class="title">使用分析</h2><label>时间范围<select id="analyticsDays" onchange="RENDER.analytics()"><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option></select></label></div><div class="card"><span class="muted">加载中…</span></div>`;
  analyticsDays.value=String(days);
  try{
    const [s,trend,excluded]=await Promise.all([
      api('GET','/admin/analytics/summary?days='+days),
      api('GET','/admin/analytics/trends?days='+days),
      api('GET','/admin/analytics/exclusions')
    ]);
    el.innerHTML=`<div class="analytics-head"><h2 class="title">使用分析</h2><label>时间范围<select id="analyticsDays" onchange="RENDER.analytics()"><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option></select></label></div>
      <div class="card"><div class="grid-stats">
        ${analyticsStat('今日 PAU',s.overview.pau??s.overview.dau)}${analyticsStat('今日 App DAU',s.overview.app_dau)}
        ${analyticsStat('今日 Widget DAU',s.overview.widget_dau)}${analyticsStat('近 30 天 MAU',s.overview.mau)}
        ${analyticsStat('App Sessions / App DAU',Number(s.overview.app_sessions_per_app_dau??s.overview.sessions_per_dau??0).toFixed(2),'所选范围 · 日均每活跃 App 用户会话数')}
        ${analyticsStat('D1 留存',formatRate(s.retention.d1_rate),s.retention.d1_base+' 人 cohort')}
        ${analyticsStat('D7 留存',formatRate(s.retention.d7_rate),s.retention.d7_base+' 人 cohort')}
      </div><p class="muted" style="margin-top:12px">会话口径：所选范围内每日 App Sessions 之和 ÷ 每日 App DAU 之和。App 冷启动或后台超过 15 分钟后返回会创建新会话；仅统计非 Widget 事件，不代表打开次数。同一会话跨天活跃时，各天分别计入。</p></div>
      <div class="card"><h3>每日活跃与 App 会话</h3><div class="legend"><span><i style="background:#3987e5"></i>PAU</span><span><i style="background:#8f6be8"></i>App DAU</span><span><i style="background:#3ecf8e"></i>Widget DAU</span><span><i style="background:#d95926"></i>App Sessions</span></div><div class="chart-wrap" id="trendChart"></div>
        <details><summary>查看数据表</summary>${trendTable(trend)}</details></div>
      <div class="analytics-grid"><div class="card"><h3>功能访问</h3><p class="muted" style="margin-bottom:10px">PV = 打开总次数；UV = 去重用户（未登录时按匿名安装去重）</p>${featureBars(s.features)}</div>
      <div class="card"><h3>页面点击 / 查看</h3><p class="muted" style="margin-bottom:10px">PV = 点击或查看总次数；UV = 去重用户/安装数</p>${breakdownTable(s.screens,'页面 · 事件','PV','UV')}</div>
      <div class="card"><h3>功能结果</h3><p class="muted" style="margin-bottom:10px">success / empty / cancelled / error</p>${breakdownTable(s.feature_results,'功能:结果','次数','用户')}</div>
      <div class="card"><h3>页面停留</h3>${durationTable(s.screen_durations)}</div>
      <div class="card"><h3>平台</h3>${breakdownTable(s.platforms,'平台','事件','用户')}</div>
      <div class="card"><h3>版本</h3>${breakdownTable(s.versions,'版本','事件','用户')}</div>
      <div class="card"><h3>小组件统计</h3><p class="muted" style="margin-bottom:10px">按事件、类型、尺寸、刷新方式和动作统计 PV / UV</p>${widgetTable(s.widgets||[])}</div>
      <div class="card"><h3>统计排除</h3><p class="muted">内部测试账号被全局排除；历史事件无需删除。</p>
        <div class="row" style="margin-top:12px"><input id="excludeUid" type="number" min="1" placeholder="用户 ID" style="max-width:180px"><button onclick="setAnalyticsExcluded(true)">排除</button><button class="ghost" onclick="setAnalyticsExcluded(false)">恢复计入</button></div>
        <div class="muted" style="margin-top:12px">当前排除：${excluded.length?excluded.map(x=>'#'+x).join('、'):'无'}</div></div></div>`;
    analyticsDays.value=String(days);
    renderTrendChart(document.getElementById('trendChart'),trend);
  }catch(e){el.innerHTML='<h2 class="title">使用分析</h2><div class="card"><span class="muted">'+esc(e.message)+'</span></div>'}
};
function analyticsStat(label,value,note=''){return `<div class="stat"><div class="n">${esc(value)}</div><div class="l">${esc(label)}</div>${note?`<div class="muted">${esc(note)}</div>`:''}</div>`}
function formatRate(v){return Number(v||0).toFixed(1)+'%'}
function analyticsName(value){const labels={campus_map:'校园地图',academic_calendar:'校历',classroom:'空教室',screen_click:'点击',screen_view:'查看',success:'成功',empty:'空结果',cancelled:'取消',error:'失败'};const parts=String(value??'').split(':');return parts.map(x=>labels[x]||x).join(' · ')}
function breakdownTable(rows,c1,c2,c3){return `<div style="overflow-x:auto"><table><thead><tr><th>${c1}</th><th>${c2}</th><th>${c3}</th></tr></thead><tbody>${(rows||[]).map(x=>`<tr><td>${esc(analyticsName(x.name))}</td><td>${x.events??0}</td><td>${x.users??0}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">暂无数据</td></tr>'}</tbody></table></div>`}
function durationTable(rows){return `<div style="overflow-x:auto"><table><thead><tr><th>页面</th><th>离开次数</th><th>用户</th><th>平均停留</th></tr></thead><tbody>${(rows||[]).map(x=>`<tr><td>${esc(analyticsName(x.name))}</td><td>${x.views??0}</td><td>${x.users??0}</td><td>${Number(x.avg_seconds||0).toFixed(1)} 秒</td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无数据</td></tr>'}</tbody></table></div>`}
function featureBars(rows){if(!rows?.length)return '<span class="muted">暂无数据</span>';const max=Math.max(...rows.map(x=>x.events),1);return `<div class="bars">${rows.map(x=>`<div class="bar-row" title="${esc(analyticsName(x.name))}：PV ${x.events}，UV ${x.users}"><span>${esc(analyticsName(x.name))}</span><div class="bar-track"><div class="bar-fill" style="width:${100*x.events/max}%"></div></div><span class="muted">${x.events} / ${x.users}</span></div>`).join('')}</div><div class="muted" style="margin-top:10px">PV / UV</div><details><summary>查看数据表</summary>${breakdownTable(rows,'功能','PV','UV')}</details>`}
function trendTable(rows){return `<div style="overflow-x:auto"><table><thead><tr><th>日期</th><th>PAU</th><th>App DAU</th><th>Widget DAU</th><th>App Sessions</th></tr></thead><tbody>${(rows||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${x.pau??x.dau??0}</td><td>${x.app_dau??0}</td><td>${x.widget_dau??0}</td><td>${x.app_sessions??x.sessions??0}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无数据</td></tr>'}</tbody></table></div>`}
function widgetTable(rows){return `<div style="overflow-x:auto"><table><thead><tr><th>事件</th><th>类型</th><th>尺寸</th><th>刷新</th><th>动作</th><th>PV</th><th>UV</th></tr></thead><tbody>${(rows||[]).map(x=>`<tr><td>${esc(x.event_type)}</td><td>${esc(x.kind)}</td><td>${esc(x.size)}</td><td>${esc(x.refresh_mode)}</td><td>${esc(x.action||'-')}</td><td>${x.events??0}</td><td>${x.users??0}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无数据</td></tr>'}</tbody></table></div>`}
function renderTrendChart(el,rows){
  if(!rows?.length){el.innerHTML='<span class="muted">暂无数据</span>';return}
  rows=rows.map(p=>({...p,app_sessions:p.app_sessions??p.sessions??0}));
  const W=760,H=250,L=42,R=14,T=14,B=30,max=Math.max(1,...rows.flatMap(x=>[x.pau??x.dau??0,x.app_dau??0,x.widget_dau??0,x.app_sessions]));
  const x=i=>L+(W-L-R)*(rows.length === 1 ? 0.5 : i/(rows.length-1)),y=v=>T+(H-T-B)*(1-v/max);
  const path=k=>rows.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]??0).toFixed(1)).join(' ');
  const grid=[0,.25,.5,.75,1].map(f=>`<line class="grid" x1="${L}" y1="${y(max*f)}" x2="${W-R}" y2="${y(max*f)}"/><text class="axis-label" x="${L-7}" y="${y(max*f)+4}" text-anchor="end">${Math.round(max*f)}</text>`).join('');
  const step=Math.max(1,Math.ceil(rows.length/7));
  const labels=rows.map((p,i)=>i%step===0||i===rows.length-1?`<text class="axis-label" x="${x(i)}" y="${H-7}" text-anchor="middle">${p.date.slice(5)}</text>`:'').join('');
  const hitW=(W-L-R)/Math.max(rows.length,1);const hits=rows.map((p,i)=>`<rect class="hit" x="${Math.max(L,x(i)-hitW/2)}" y="${T}" width="${hitW}" height="${H-T-B}" onmousemove="chartTip(event,'${p.date}',${p.pau??p.dau??0},${p.app_dau??0},${p.widget_dau??0},${p.app_sessions})" onmouseleave="chartTipHide()"/>`).join('');
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="每日 PAU、App DAU、Widget DAU 和 App 会话趋势">${grid}${labels}<path class="series-pau" d="${path('pau')}"/><path class="series-app" d="${path('app_dau')}"/><path class="series-widget" d="${path('widget_dau')}"/><path class="series-sessions" d="${path('app_sessions')}"/>${hits}</svg><div class="chart-tip" id="chartTip" hidden></div>`;
}
function chartTip(ev,date,pau,appDau,widgetDau,appSessions){const tip=document.getElementById('chartTip'),box=ev.currentTarget.ownerSVGElement.getBoundingClientRect();tip.hidden=false;tip.textContent=date+'  PAU '+pau+'  App '+appDau+'  Widget '+widgetDau+'  App Sessions '+appSessions;tip.style.left=Math.min(ev.clientX-box.left+12,box.width-220)+'px';tip.style.top=Math.max(8,ev.clientY-box.top-42)+'px'}
function chartTipHide(){const t=document.getElementById('chartTip');if(t)t.hidden=true}
async function setAnalyticsExcluded(excluded){const id=+document.getElementById('excludeUid').value;if(!id)return toast('请输入有效用户 ID',1);try{await api('POST','/admin/analytics/exclusions',{user_id:id,excluded});toast(excluded?'已排除':'已恢复计入');RENDER.analytics()}catch(e){toast(e.message,1)}}

async function loadPremiumCodes(){try{const state=document.getElementById('pm_code_state')?.value||'';const list=await api('GET','/admin/memberships/activation-codes?limit=100&state='+encodeURIComponent(state));const el=document.getElementById('premiumCodes');if(!el)return;el.innerHTML=list.map(c=>`<tr><td>${c.id}</td><td>${esc(c.membership_type)}</td><td>${esc(c.order_id||'-')}</td><td><span class="badge ${c.state==='unused'?'ok':c.state==='used'?'info':'danger'}">${esc(c.state)}</span></td><td>${c.used_by_user_id||'-'}</td><td>${fmtTime(c.created_at)}<br><span class="muted">${c.expires_at?fmtTime(c.expires_at):'不设过期'}</span></td><td>${c.state==='unused'?`<button class="sm danger" onclick="disablePremiumCode(${c.id})">软删除</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan=7 class="muted">暂无激活码</td></tr>'}catch(e){const el=document.getElementById('premiumCodes');if(el)el.innerHTML='<tr><td colspan=7 class="muted">'+esc(e.message)+'</td></tr>'}}

function collectPremiumFeatures(){return [...document.querySelectorAll('#pm_features_editor [data-feature-row]')].map(row=>({key:row.querySelector('[data-feature=key]').value.trim(),title:row.querySelector('[data-feature=title]').value.trim(),description:row.querySelector('[data-feature=description]').value.trim(),enabled:row.querySelector('[data-feature=enabled]').checked})).filter(f=>f.key||f.title)}
function resetPremiumType(){document.getElementById('pm_edit_key').value='';document.getElementById('pm_key').value='';document.getElementById('pm_key').disabled=false;document.getElementById('pm_title').value='';document.getElementById('pm_plan').value='';document.getElementById('pm_desc').value='';document.getElementById('pm_enabled').checked=true;document.getElementById('pm_features_editor').innerHTML='';addPremiumFeature({key:'premium_center',title:'Premium 会员权益',description:'查看并使用 Premium 会员功能'});}
function editPremiumType(index){const t=window.PREMIUM_TYPES?.[index];if(!t)return;document.getElementById('pm_edit_key').value=t.key;document.getElementById('pm_key').value=t.key;document.getElementById('pm_key').disabled=true;document.getElementById('pm_title').value=t.title||'';document.getElementById('pm_plan').value=t.afdian_plan_id||'';document.getElementById('pm_desc').value=t.description||'';document.getElementById('pm_enabled').checked=t.enabled!==false;document.getElementById('pm_features_editor').innerHTML='';(t.features||[]).forEach(addPremiumFeature);window.scrollTo({top:0,behavior:'smooth'})}
async function savePremiumType(){const key=document.getElementById('pm_key').value.trim(),title=document.getElementById('pm_title').value.trim(),plan=document.getElementById('pm_plan').value.trim(),desc=document.getElementById('pm_desc').value.trim(),features=collectPremiumFeatures();if(!key||!title)return toast('请填写类型 key 和名称',1);if(features.some(f=>!f.key||!/^[a-z][a-z0-9_]{0,63}$/.test(f.key)))return toast('权益 key 必须是小写字母、数字或下划线',1);try{await api('POST','/admin/memberships/types',{key,title,description:desc,afdian_plan_id:plan,features,enabled:document.getElementById('pm_enabled').checked});toast('会员类型已保存');RENDER.premium()}catch(e){toast(e.message,1)}}
async function generatePremiumCode(){const type=document.getElementById('pm_code_type').value.trim();if(!type)return toast('请选择会员类型',1);try{const r=await api('POST','/admin/memberships/activation-codes',{type_key:type,order_id:document.getElementById('pm_order').value.trim()});document.getElementById('pm_generated').innerHTML='激活码：<code id="pm_plain_code">'+esc(r.code)+'</code> <button class="sm" onclick="navigator.clipboard.writeText(document.getElementById(\'pm_plain_code\').textContent);toast(\'已复制激活码\')">复制</button><div class="muted">明文仅在本次生成响应中显示，离开页面后无法恢复。</div>';toast('激活码已生成')}catch(e){toast(e.message,1)}}
async function grantPremium(){const uid=+document.getElementById('pm_uid').value,type=document.getElementById('pm_grant_type').value.trim(),reason=document.getElementById('pm_reason').value.trim(),raw=document.getElementById('pm_expires').value;const expires=raw?new Date(raw).toISOString():'';if(!uid||!type||!reason)return toast('请填写用户、类型和原因',1);try{await api('POST','/admin/memberships/grant',{user_id:uid,type_key:type,reason,expires_at:expires});toast('已授权');RENDER.premium()}catch(e){toast(e.message,1)}}
async function editPremiumExpiry(id,current){const next=prompt('输入新的到期时间（ISO 8601，例如 2099-12-31T23:59:59+08:00）',current||'');if(!next)return;const reason=prompt('修改原因','管理员调整会员有效期');if(!reason)return;try{await api('POST','/admin/memberships/grants/expire',{grant_id:id,expires_at:next,reason});toast('有效期已修改');RENDER.premium()}catch(e){toast(e.message,1)}}

function fmtTime(v){if(!v)return '<span class="muted">暂无</span>';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):esc(d.toLocaleString())}

const usersState={page:1,search:'',total:0,loading:false,request:0};
RENDER.users=()=>{
  const el=document.getElementById('p-users');
  el.innerHTML=`<h2 class="title">用户</h2><div class="card">
    <form class="row users-search" onsubmit="event.preventDefault();searchUsers()">
      <input id="usersSearch" type="search" placeholder="搜索用户 ID / 昵称 / 身份" aria-label="搜索用户" value="${esc(usersState.search)}">
      <button type="submit">搜索</button><button type="button" class="ghost" onclick="searchUsers(true)">清空</button>
    </form>
    <div class="muted" style="margin-bottom:8px">设备信息来自用户同意隐私协议后的最新埋点；最后上线时间来自认证请求。左右滑动查看完整表格。</div>
    <div class="users-scroll" tabindex="0" role="region" aria-label="用户列表，可左右滚动"><table class="users-table"><thead><tr><th>ID</th><th>昵称</th><th>身份</th><th>App 版本</th><th>平台 / 系统</th><th>设备</th><th>最后上线</th><th>状态</th><th>操作</th></tr></thead><tbody id="ut"></tbody></table></div>
    <div class="row users-pagination"><span class="muted" id="usersPageInfo" aria-live="polite"></span>
      <button class="ghost" id="usersFirst" onclick="jumpUsersPage(1)" disabled>首页</button>
      <button class="ghost" id="usersPrev" onclick="changeUsersPage(-1)" disabled>上一页</button>
      <button class="ghost" id="usersNext" onclick="changeUsersPage(1)" disabled>下一页</button>
      <button class="ghost" id="usersLast" onclick="jumpUsersPage(Math.max(1,Math.ceil(usersState.total/25)))" disabled>尾页</button>
      <form class="row users-jump" onsubmit="event.preventDefault();jumpUsersPage()">
        <input id="usersPageInput" type="number" min="1" max="1" step="1" value="${usersState.page}" aria-label="跳转页码" disabled>
        <button class="ghost" id="usersJump" type="submit" disabled>跳转</button>
      </form>
      <button class="ghost" onclick="loadUsers()">刷新</button>
    </div></div>`;
  return loadUsers();
};
function searchUsers(clear=false){
  const input=document.getElementById('usersSearch');
  if(clear)input.value='';
  usersState.search=input.value.trim();usersState.page=1;
  loadUsers();
}
function changeUsersPage(delta){jumpUsersPage(usersState.page+delta)}
function jumpUsersPage(page){
  if(usersState.loading||document.getElementById('usersJump').disabled)return;
  const last=Math.max(1,Math.ceil(usersState.total/25));
  if(page===undefined)page=Number(document.getElementById('usersPageInput').value);
  if(!Number.isSafeInteger(page)||page<1||page>last)return toast(`请输入 1 到 ${last} 之间的整数页码`,1);
  document.getElementById('usersPageInput').value=page;
  if(page===usersState.page)return;
  usersState.page=page;loadUsers();
}
async function loadUsers(){
  const tbody=document.getElementById('ut'),info=document.getElementById('usersPageInfo');
  if(!tbody)return;
  const request=++usersState.request;
  usersState.loading=true;
  for(const id of ['usersFirst','usersPrev','usersNext','usersLast','usersPageInput','usersJump'])document.getElementById(id).disabled=true;
  tbody.innerHTML='<tr><td colspan="9" class="muted">加载中…</td></tr>';
  info.textContent='加载中…';
  try{
    const params=new URLSearchParams({page:String(usersState.page),q:usersState.search});
    const result=await api('GET','/admin/users?'+params);
    if(request!==usersState.request)return;
    usersState.page=result.page;usersState.total=result.total;
    tbody.innerHTML=result.items.map(u=>`<tr>
      <td>${u.id}</td>
      <td>${esc(u.nickname)}${u.role==='admin'?' <span class="badge info">admin</span>':''}${u.is_whitelisted?' <span class="badge ok">白名单</span>':''}${u.is_beta?' <span class="badge warn">legacy beta</span>':''}${u.is_premium?' <span class="badge ok">Premium</span>':''}</td>
      <td class="muted">${esc(u.identities||'-')}</td>
      <td>${u.app_version?'<span class="badge info">'+esc(u.app_version)+'</span>':'<span class="muted">未上报</span>'}</td>
      <td>${u.app_platform?esc(u.app_platform)+(u.app_os_version?'<br><span class="muted">'+esc(u.app_os_version)+'</span>':''):'<span class="muted">未上报</span>'}</td>
      <td>${u.device_brand||u.device_model?esc([u.device_brand,u.device_model].filter(Boolean).join(' ')):'<span class="muted">未上报</span>'}</td>
      <td>${fmtTime(u.last_online_at)}</td>
      <td>${u.is_banned?'<span class="badge danger">封禁</span>':'<span class="badge ok">正常</span>'}</td>
      <td><div class="row">
        <button class="sm ${u.is_banned?'':'danger'}" onclick="banUser(${u.id},${!u.is_banned})">${u.is_banned?'解封':'封禁'}</button>
        <button class="sm ghost" onclick="toggleWhite(${u.id},${!u.is_whitelisted})">${u.is_whitelisted?'移出白名单':'加白名单'}</button>
        <button class="sm ghost" onclick="setBeta(${u.id},${!u.is_beta})">${u.is_beta?'移出 beta':'加入 beta'}</button>
        <button class="sm ghost" onclick="setAdmin(${u.id},'${u.role==='admin'?'user':'admin'}')">${u.role==='admin'?'降为用户':'设为admin'}</button>
        <button class="sm danger" data-name="${esc(u.nickname)}" onclick="delUser(${u.id},this.dataset.name)">删除</button>
      </div></td></tr>`).join('')||'<tr><td colspan="9" class="muted">暂无匹配用户</td></tr>';
    const pages=Math.max(1,Math.ceil(result.total/result.page_size));
    info.textContent=`共 ${result.total} 个用户 · 第 ${result.page} / ${pages} 页 · 每页 ${result.page_size} 条`;
    document.getElementById('usersFirst').disabled=result.page<=1;
    document.getElementById('usersPrev').disabled=result.page<=1;
    document.getElementById('usersNext').disabled=result.page>=pages;
    document.getElementById('usersLast').disabled=result.page>=pages;
    const pageInput=document.getElementById('usersPageInput');
    pageInput.value=result.page;pageInput.max=pages;pageInput.disabled=result.total===0;
    document.getElementById('usersJump').disabled=result.total===0;
  }catch(e){

const crashesState={page:1,pageSize:25,search:'',errorType:'',total:0,loading:false,request:0};
RENDER.crashes=()=>{
  const el=document.getElementById('p-crashes');
  el.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:20px"><h2 class="title" style="margin:0">崩溃上报</h2><button class="danger" onclick="deleteCrashReports()">清空全部</button></div><div class="card">
    <form class="row users-search" onsubmit="event.preventDefault();searchCrashes()">
      <input id="crashesSearch" type="search" placeholder="搜索记录/用户 ID、昵称、版本、机型、错误或堆栈" aria-label="搜索崩溃上报" value="${esc(crashesState.search)}">
      <select id="crashesType" aria-label="错误分类" onchange="filterCrashes()"><option value="">全部分类</option>${crashesState.errorType?`<option selected value="${esc(crashesState.errorType)}">${esc(crashesState.errorType)}</option>`:''}</select>
      <button type="submit">搜索</button><button type="button" class="ghost" onclick="searchCrashes(true)">清空</button>
    </form>
    <div class="muted" style="margin-bottom:8px">按最新上报排序。展开“堆栈”可查看完整错误上下文。</div>
    <div class="crash-scroll" tabindex="0" role="region" aria-label="崩溃上报列表，可左右滚动"><table class="crash-table"><thead><tr><th>ID / 时间</th><th>用户</th><th>版本 / 设备</th><th>类型</th><th>错误信息</th><th>操作</th></tr></thead><tbody id="crashRows"></tbody></table></div>
    <div class="row users-pagination"><span class="muted" id="crashesPageInfo" aria-live="polite"></span>
      <button class="ghost" id="crashesFirst" onclick="jumpCrashesPage(1)" disabled>首页</button>
      <button class="ghost" id="crashesPrev" onclick="changeCrashesPage(-1)" disabled>上一页</button>
      <button class="ghost" id="crashesNext" onclick="changeCrashesPage(1)" disabled>下一页</button>
      <button class="ghost" id="crashesLast" onclick="jumpCrashesPage(Math.max(1,Math.ceil(crashesState.total/crashesState.pageSize)))" disabled>尾页</button>
      <form class="row users-jump" onsubmit="event.preventDefault();jumpCrashesPage()">
        <input id="crashesPageInput" type="number" min="1" max="1" step="1" value="${crashesState.page}" aria-label="跳转页码" disabled>
        <button class="ghost" id="crashesJump" type="submit" disabled>跳转</button>
      </form>
      <button class="ghost" onclick="loadCrashes()">刷新</button>
    </div></div>`;
  return loadCrashes();
};
function searchCrashes(clear=false){
  const input=document.getElementById('crashesSearch');
  if(clear)input.value='';
  crashesState.search=input.value.trim();crashesState.page=1;loadCrashes();
}
function filterCrashes(){crashesState.errorType=document.getElementById('crashesType').value;crashesState.page=1;loadCrashes()}
function changeCrashesPage(delta){jumpCrashesPage(crashesState.page+delta)}
function jumpCrashesPage(page){
  if(crashesState.loading||document.getElementById('crashesJump').disabled)return;
  const last=Math.max(1,Math.ceil(crashesState.total/crashesState.pageSize));
  if(page===undefined)page=Number(document.getElementById('crashesPageInput').value);
  if(!Number.isSafeInteger(page)||page<1||page>last)return toast(`请输入 1 到 ${last} 之间的整数页码`,1);
  document.getElementById('crashesPageInput').value=page;
  if(page===crashesState.page)return;
  crashesState.page=page;loadCrashes();
}
async function loadCrashes(){
  const tbody=document.getElementById('crashRows'),info=document.getElementById('crashesPageInfo');
  if(!tbody)return;
  const request=++crashesState.request;
  crashesState.loading=true;
  for(const id of ['crashesFirst','crashesPrev','crashesNext','crashesLast','crashesPageInput','crashesJump'])document.getElementById(id).disabled=true;
  tbody.innerHTML='<tr><td colspan="6" class="muted">加载中…</td></tr>';info.textContent='加载中…';
  try{
    const params=new URLSearchParams({page:String(crashesState.page),q:crashesState.search,error_type:crashesState.errorType});
    const result=await api('GET','/admin/crash-reports?'+params);
    if(request!==crashesState.request)return;
    crashesState.page=result.page;crashesState.pageSize=result.page_size;crashesState.total=result.total;
    const typeSelect=document.getElementById('crashesType');
    typeSelect.innerHTML='<option value="">全部分类</option>'+(result.error_types||[]).map(x=>`<option value="${esc(x)}"${x===crashesState.errorType?' selected':''}>${esc(x)}</option>`).join('');
    tbody.innerHTML=result.items.map(c=>`<tr>
      <td><strong>#${c.id}</strong><div class="muted">${fmtTime(c.created_at)}</div></td>
      <td>${c.user_id?`#${c.user_id}${c.nickname?'<div class="muted">'+esc(c.nickname)+'</div>':''}`:'<span class="muted">未登录</span>'}</td>
      <td>${esc(c.app_version||'-')} · ${esc(c.platform||'-')}<div class="muted">${esc(c.device_model||'未知设备')}</div></td>
      <td><span class="badge danger">${esc(c.error_type||'unknown')}</span></td>
      <td class="crash-message">${esc(c.message||'-')}${c.stack?`<details><summary>查看堆栈</summary><pre class="crash-stack">${esc(c.stack)}</pre></details>`:''}</td>
      <td><button class="sm danger" onclick="deleteCrashReports(${c.id})">删除</button></td>
    </tr>`).join('')||'<tr><td colspan="6" class="muted">暂无匹配的崩溃上报</td></tr>';
    const pages=Math.max(1,Math.ceil(result.total/result.page_size));
    info.textContent=`共 ${result.total} 条 · 第 ${result.page} / ${pages} 页 · 每页 ${result.page_size} 条`;
    document.getElementById('crashesFirst').disabled=result.page<=1;
    document.getElementById('crashesPrev').disabled=result.page<=1;
    document.getElementById('crashesNext').disabled=result.page>=pages;
    document.getElementById('crashesLast').disabled=result.page>=pages;
    const pageInput=document.getElementById('crashesPageInput');
    pageInput.value=result.page;pageInput.max=pages;pageInput.disabled=result.total===0;
    document.getElementById('crashesJump').disabled=result.total===0;
  }catch(e){
    if(request!==crashesState.request)return;
    tbody.innerHTML='<tr><td colspan="6" class="muted">'+esc(e.message)+'</td></tr>';
    info.textContent='加载失败，请点击刷新重试';
  }finally{if(request===crashesState.request)crashesState.loading=false}
}
async function deleteCrashReports(id){
  const all=!id;
  if(!confirm(all?'确认清空全部崩溃上报？此操作不可恢复。':`确认删除崩溃上报 #${id}？`))return;
  try{
    const result=await api('DELETE','/admin/crash-reports'+(all?'':'?id='+id));
    toast(`已删除 ${result.deleted} 条记录`);
    if(all)crashesState.page=1;
    loadCrashes();
  }catch(e){toast(e.message,1)}
}

async function loadReleases(){

function editWhatsNew(id){

async function saveWhatsNew(){

async function clearWhatsNew(){

function formatArtifactSize(n){n=Number(n||0);if(n<1024*1024)return n+' B';return (n/1024/1024).toFixed(1)+' MB'}
function showReleaseArtifact(a){const box=document.getElementById('rel_artifact');if(!a){box.style.display='none';return}box.style.display='block';document.getElementById('rel_artifact_version').textContent=a.version_name||'-';document.getElementById('rel_artifact_build').textContent=a.version_code||'-';document.getElementById('rel_artifact_size').textContent=formatArtifactSize(a.size_bytes);const sha=String(a.sha256||'');document.getElementById('rel_artifact_sha').textContent=sha.length>20?sha.slice(0,10)+'…'+sha.slice(-8):sha||'-';document.getElementById('rel_artifact_time').textContent=a.verified_at?'刚刚':'-'}
async function inspectReleaseAPK(){const url=rel_android.value.trim();if(!url)return toast('请先粘贴 APK URL',1);try{const a=await api('POST','/admin/releases/inspect-apk',{url});showReleaseArtifact(a);toast('APK 已验证')}catch(e){showReleaseArtifact(null);toast(e.message,1)}}
function editReleaseById(id){const r=(window.releaseRecords||[]).find(x=>x.id===id);if(r)editRelease(r)}
function editRelease(r){rel_id.value=r.id;rel_channel.value=r.channel;rel_update_mode.value=r.update_mode==='silent'?'silent':'popup';rel_min.value=r.min_supported||'';rel_min_build.value=r.min_supported_build_number||0;rel_android.value=r.android_url||'';rel_windows.value=r.windows_url||'';rel_windows_sha.value=r.windows_sha256||'';rel_ios.value=r.ios_url||'';rel_changelog.value=r.changelog||'';rel_force.checked=!!r.force;showReleaseArtifact(r.android_version_name?{version_name:r.android_version_name,version_code:r.android_version_code,size_bytes:r.android_size_bytes,sha256:r.android_sha256,verified_at:r.android_verified_at}:null);window.scrollTo(0,0)}
function resetRelease(){['rel_id','rel_android','rel_windows','rel_windows_sha','rel_ios','rel_changelog'].forEach(i=>document.getElementById(i).value='');rel_channel.value='stable';rel_update_mode.value='popup';rel_min.value='';rel_min_build.value=0;rel_force.checked=false;showReleaseArtifact(null)}
async function saveRelease(){const b={id:+rel_id.value||0,channel:rel_channel.value,update_mode:rel_update_mode.value,min_supported:rel_min.value.trim(),min_supported_build_number:+rel_min_build.value||0,android_url:rel_android.value.trim(),windows_url:rel_windows.value.trim(),windows_sha256:rel_windows_sha.value.trim(),ios_url:rel_ios.value.trim(),changelog:rel_changelog.value,force:rel_force.checked};try{const result=await api('POST','/admin/releases',b);showReleaseArtifact(result.artifact);toast('发布记录已保存');resetRelease();loadReleases()}catch(e){toast(e.message,1)}}
async function saveHistoricalRelease(){const b={version:hist_version.value.trim(),build_number:+hist_build.value||0,channel:hist_channel.value,min_supported:hist_min.value.trim(),min_supported_build_number:+hist_min_build.value||0,changelog:hist_changelog.value,force:hist_force.checked};if(!b.version||b.build_number<=0)return toast('请填写有效的版本和 build',1);if(!b.changelog.trim())return toast('请填写更新说明',1);try{await api('POST','/admin/releases/backfill',b);toast('历史 Release 已补登');resetHistoricalRelease();loadReleases()}catch(e){toast(e.message,1)}}
function resetHistoricalRelease(){hist_version.value='';hist_build.value='';hist_channel.value='stable';hist_min.value='';hist_min_build.value=0;hist_changelog.value='';hist_force.checked=false}

async function deleteRelease(id){if(!confirm('确认软删除该发布记录？'))return;try{await api('DELETE','/admin/releases?id='+id);toast('已软删除');loadReleases()}catch(e){toast(e.message,1)}}

async function loadLegal(){

}

function campusMapWorld(lon,lat,zoom){
  const scale=256*Math.pow(2,zoom),clamped=Math.max(-85.05112878,Math.min(85.05112878,lat));

  return {x:(lon+180)/360*scale,y:(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*scale};
}
function campusMapLonLat(x,y,zoom){
  const scale=256*Math.pow(2,zoom),n=Math.PI-2*Math.PI*y/scale;
  return {lon:x/scale*360-180,lat:180/Math.PI*Math.atan(Math.sinh(n))};
}

  const body=document.getElementById('campus_place_rows');if(!body)return;
  const campus=document.getElementById('campus_place_filter')?.value||'';
  try{CAMPUS_MAP_PLACES=await api('GET','/admin/campus-map/places'+(campus?'?campus_id='+encodeURIComponent(campus):''));body.innerHTML=CAMPUS_MAP_PLACES.map(x=>`<tr><td>${x.id}</td><td><span class="muted">${esc(campusMapLabel(CAMPUS_MAP_CAMPUSES,x.campus_id))}</span><br><b>${esc(x.name)}</b></td><td>${esc(campusMapLabel(CAMPUS_MAP_CATEGORIES,x.category))}<br><span class="muted">${esc((x.types||[]).map(t=>campusMapTypeLabel(x.category,t)).join('、'))}</span></td><td style="font-family:monospace">${Number(x.longitude).toFixed(7)}, ${Number(x.latitude).toFixed(7)}<br><span class="muted">${esc(x.coordinate_system)}</span></td><td>${x.sort||0}</td><td><span class="badge ${x.active?'ok':'warn'}">${x.active?'已上线':'已下线'}</span></td><td><button class="sm" onclick="editCampusMapPlace(${x.id})">编辑</button> ${x.active?`<button class="sm danger" onclick="deactivateCampusMapPlace(${x.id})">下线</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无正式地点</td></tr>'}catch(e){body.innerHTML='<tr><td colspan="7" class="muted">'+esc(e.message)+'</td></tr>'}
}
function fillCampusMapPlaceForm(x){campus_place_id.value=x.id||0;campus_place_campus.value=x.campus_id;campus_place_category.value=x.category;campusMapRenderTypes(x.types||[]);campus_place_name.value=x.name||'';campus_place_aliases.value=(x.aliases||[]).join(',');campus_place_lat.value=x.latitude;campus_place_lon.value=x.longitude;campus_place_crs.value=x.coordinate_system||'CGCS2000';campus_place_sort.value=x.sort||0;campus_place_address.value=x.address||'';campus_place_description.value=x.description||'';campus_place_active.checked=x.active!==false;campusMapUseInputPoint();window.scrollTo({top:0,behavior:'smooth'})}
function setCampusMapReviewContext(id){CAMPUS_MAP_REVIEW_ID=id||0;const hint=document.getElementById('campus_place_review_context'),button=document.getElementById('campus_place_save');if(hint)hint.textContent=id?`正在编辑待审上报 #${id}；保存后将同时通过审核并发布。`:'';if(button)button.textContent=id?'编辑后通过并发布':'保存地点'}
function editCampusMapPlace(id){const x=CAMPUS_MAP_PLACES.find(p=>p.id===id);if(!x)return;setCampusMapReviewContext(0);fillCampusMapPlaceForm(x)}
function resetCampusMapPlace(preserveContext=false){setCampusMapReviewContext(0);campus_place_id.value=0;campus_place_name.value='';campus_place_aliases.value='';campus_place_lat.value='';campus_place_lon.value='';campus_place_address.value='';campus_place_description.value='';CAMPUS_MAP_PICKER.point=null;if(preserveContext){campusMapRenderPicker();return}campus_place_campus.value='xiaoxiang';campus_place_category.value='teaching_research';campusMapRenderTypes();campus_place_crs.value='CGCS2000';campus_place_sort.value=0;campus_place_active.checked=true;campusMapMoveToCampus()}
async function saveCampusMapPlace(){const lat=campus_place_lat.value.trim(),lon=campus_place_lon.value.trim();if(!lat||!lon)return toast('请先在地图选点或填写经纬度',1);const body={id:+campus_place_id.value,campus_id:campus_place_campus.value,name:campus_place_name.value.trim(),latitude:+lat,longitude:+lon,coordinate_system:campus_place_crs.value,category:campus_place_category.value,types:Array.from(document.querySelectorAll('#campus_place_types input[name="campus_place_type"]:checked')).map(x=>x.value),address:campus_place_address.value.trim(),description:campus_place_description.value.trim(),aliases:campus_place_aliases.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),sort:+campus_place_sort.value,active:campus_place_active.checked};try{if(CAMPUS_MAP_REVIEW_ID){const note=prompt('确认以当前编辑后的内容通过审核并发布。可填写审核备注：','');if(note===null)return;body.id=0;body.active=true;await api('POST','/admin/campus-map/contributions/review',{id:CAMPUS_MAP_REVIEW_ID,decision:'approved',review_note:note.trim(),proposed_place:body});toast('上报已按编辑内容通过并发布');resetCampusMapPlace(true);await Promise.all([loadCampusMapContributions(),loadCampusMapPlaces()]);return}await api('POST','/admin/campus-map/places',body);toast('校园地点已保存，可继续在当前区域添加');resetCampusMapPlace(true);loadCampusMapPlaces()}catch(e){toast(e.message,1)}}
async function deactivateCampusMapPlace(id){if(!confirm('确认下线该地点？App 刷新后将不再展示。'))return;try{await api('DELETE','/admin/campus-map/places?id='+id);toast('地点已下线');loadCampusMapPlaces()}catch(e){toast(e.message,1)}}
async function loadCampusMapContributions(){
  const body=document.getElementById('campus_contribution_rows');if(!body)return;
  const status=document.getElementById('campus_contribution_filter')?.value||'';
  try{CAMPUS_MAP_CONTRIBUTIONS=await api('GET','/admin/campus-map/contributions'+(status?'?status='+encodeURIComponent(status):''));body.innerHTML=CAMPUS_MAP_CONTRIBUTIONS.map(x=>{const p=x.proposed_place,content=x.kind==='new_place'&&p?`<b>${esc(p.name)}</b><br>${esc(campusMapLabel(CAMPUS_MAP_CAMPUSES,p.campus_id))} · ${esc(campusMapLabel(CAMPUS_MAP_CATEGORIES,p.category))}<br><span class="muted">${Number(p.longitude).toFixed(7)}, ${Number(p.latitude).toFixed(7)}</span>${(p.aliases||[]).length?'<br><span class="muted">别名：'+esc(p.aliases.join('、'))+'</span>':''}${p.description?'<br>'+esc(p.description):''}${x.message?'<br>'+esc(x.message):''}`:`地点 #${x.place_id}<br>${esc(x.message)}`;const actions=x.status==='pending'?`${x.kind==='new_place'?`<button class="sm ghost" onclick="viewContributionPlace(${x.id})">地图查看</button> <button class="sm" onclick="editContributionPlace(${x.id})">编辑后发布</button> `:`<button class="sm ghost" onclick="loadContributionPlace(${x.place_id})">载入地点</button> `}<button class="sm" onclick="reviewCampusMapContribution(${x.id},'approved')">直接通过</button> <button class="sm danger" onclick="reviewCampusMapContribution(${x.id},'rejected')">拒绝</button>`:'-';const history=`待审 ${x.user_pending_count||0} · 通过 ${x.user_approved_count||0} · 拒绝 ${x.user_rejected_count||0}`;return `<tr><td>#${x.id}<br><span class="muted">用户 ${x.user_id} ${esc(x.user_nickname||'')}<br>${history}${(x.corroboration_count||0)>1?' · '+x.corroboration_count+' 人佐证':''}</span></td><td>${x.kind==='new_place'?'新增地点':'地点纠错'}</td><td>${content}</td><td>${fmtTime(x.created_at)}</td><td><span class="badge ${x.status==='approved'?'ok':x.status==='pending'?'warn':''}">${x.status==='pending'?'待审核':x.status==='approved'?'已通过':'已拒绝'}</span>${x.review_note?'<br><span class="muted">'+esc(x.review_note)+'</span>':''}</td><td>${actions}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted">暂无上报</td></tr>'}catch(e){body.innerHTML='<tr><td colspan="6" class="muted">'+esc(e.message)+'</td></tr>'}
}
function loadContributionPlace(id){const place=CAMPUS_MAP_PLACES.find(x=>x.id===id);if(!place)return toast('正式地点列表中找不到该地点，请刷新后重试',1);editCampusMapPlace(id)}
function viewContributionPlace(id){const x=CAMPUS_MAP_CONTRIBUTIONS.find(item=>item.id===id),p=x?.proposed_place;if(!p)return toast('上报中没有可查看的地点信息',1);campus_place_campus.value=p.campus_id;campus_place_lat.value=p.latitude;campus_place_lon.value=p.longitude;campusMapUseInputPoint();document.getElementById('campus_map_picker')?.scrollIntoView({behavior:'smooth',block:'center'})}
function editContributionPlace(id){const x=CAMPUS_MAP_CONTRIBUTIONS.find(item=>item.id===id),p=x?.proposed_place;if(!p)return toast('上报中没有可编辑的地点信息',1);fillCampusMapPlaceForm({...p,id:0,active:true});setCampusMapReviewContext(id)}
async function reviewCampusMapContribution(id,decision){const action=decision==='approved'?'通过':'拒绝',note=prompt(action+'该上报。可填写审核备注：','');if(note===null)return;try{await api('POST','/admin/campus-map/contributions/review',{id,decision,review_note:note.trim()});toast('已'+action);await Promise.all([loadCampusMapContributions(),loadCampusMapPlaces()])}catch(e){toast(e.message,1)}}

// --- 空教室离线数据 ---
RENDER.classroom=async()=>{
  const el=document.getElementById('p-classroom');
  el.innerHTML=`<h2 class="title">空教室数据</h2>
    <div class="card"><h3>发布学期 SQLite 包</h3><p class="muted">先在本机将 CSV 构建为 SQLite，再手工上传到 R2。这里粘贴公开 HTTPS 地址后，服务端会重新下载并计算 SHA-256 与文件大小；不接受手填摘要。</p>
      <div class="formgrid"><div><label>学期 ID</label><input id="classroom_term" value="2026-2027-1" placeholder="2026-2027-1"></div><div><label>显示名称</label><input id="classroom_name" value="2026-2027年度 第一学期"></div><div><label>第一周周一</label><input id="classroom_monday" type="date" value="2026-09-07"></div><div><label>总周数</label><input id="classroom_weeks" type="number" min="1" max="32" value="20"></div></div>
      <label>R2 公共 HTTPS URL</label><input id="classroom_url" placeholder="https://.../classroom_2026-2027-1.sqlite">
      <div class="row" style="margin-top:12px"><button onclick="publishClassroomData()">验证并发布</button><span class="muted" id="classroom_result"></span></div></div>
    <div class="card"><div class="row"><h3 style="margin:0;flex:1">已登记版本</h3><button class="sm ghost" onclick="loadClassroomData()">刷新</button></div><div style="overflow-x:auto"><table><thead><tr><th>学期</th><th>起始 / 周数</th><th>文件</th><th>SHA-256</th><th>验证时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="classroom_rows"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody></table></div></div>`;
  loadClassroomData();
};
async function loadClassroomData(){
  const body=document.getElementById('classroom_rows'); if(!body)return;
  try{const rows=await api('GET','/admin/classroom-data');body.innerHTML=rows.map(x=>`<tr><td><b>${esc(x.term_id)}</b><br><span class="muted">${esc(x.display_name||'-')}</span></td><td>${esc(String(x.first_monday||'').slice(0,10))}<br>${x.total_weeks} 周</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">R2 数据包</a><br><span class="muted">${Number(x.size_bytes||0).toLocaleString()} bytes</span></td><td style="font-family:monospace;font-size:11px">${esc(x.sha256)}</td><td>${fmtTime(x.verified_at)}</td><td><span class="badge ${x.active?'ok':'warn'}">${x.active?'已发布':'已归档'}</span></td><td>${x.active?`<button class="sm danger" onclick="archiveClassroomData('${esc(x.term_id)}')">归档</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无已发布数据</td></tr>'}catch(e){body.innerHTML='<tr><td colspan="7" class="muted">'+esc(e.message)+'</td></tr>'}
}
async function publishClassroomData(){
  const result=document.getElementById('classroom_result');result.textContent='服务端校验中…';
  const body={term_id:document.getElementById('classroom_term').value.trim(),display_name:document.getElementById('classroom_name').value.trim(),first_monday:document.getElementById('classroom_monday').value,total_weeks:+document.getElementById('classroom_weeks').value,url:document.getElementById('classroom_url').value.trim()};
  try{const item=await api('POST','/admin/classroom-data',body);result.textContent='已验证：'+item.sha256+' · '+Number(item.size_bytes).toLocaleString()+' bytes';toast('空教室数据已发布');loadClassroomData()}catch(e){result.textContent='';toast(e.message,1)}
}
async function archiveClassroomData(term){if(!confirm('确认归档 '+term+'？App 将不再收到该学期。'))return;try{await api('DELETE','/admin/classroom-data?term_id='+encodeURIComponent(term));toast('已归档');loadClassroomData()}catch(e){toast(e.message,1)}}

</script>
</body>
</html>
