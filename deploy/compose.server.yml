name: zonenan-v2
services:
  backend:
    image: zonenan-backend-new:phase8
    container_name: zonenan-backend-new
    restart: unless-stopped
    env_file: /root/zonenan-backend-new/.env
    ports: ["127.0.0.1:18088:8080"]
    volumes:
      - uploads:/var/lib/zonenan/merchant-uploads
      - map_tiles:/var/lib/zonenan/map-tiles
    networks:
      database:
        aliases: [app]
      edge:
        aliases: [backend, app]
  worker:
    image: zonenan-backend-new:phase8
    container_name: zonenan-worker-new
    restart: unless-stopped
    env_file: /root/zonenan-backend-new/.env
    entrypoint: /usr/local/bin/zonenan-worker
    networks: [database]
  admin:
    image: zonenan-admin:phase8
    container_name: zonenan-admin
    restart: unless-stopped
    ports: ["127.0.0.1:13000:80"]
    networks: [edge]
  merchant:
    image: zonenan-merchant:phase8
    container_name: zonenan-merchant
    restart: unless-stopped
    ports: ["127.0.0.1:13001:80"]
    networks: [edge]
networks:
  database:
    external: true
    name: zonenan-backend_default
  edge:
    external: true
    name: cloud-services_default
volumes:
  uploads:
    external: true
    name: zonenan_v2_uploads
  map_tiles:
    external: true
    name: zonenan-backend_map_tile_cache
